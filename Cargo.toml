[package]
name = "jot"
version = "0.1.2"
edition = "2021"
description = "Sync @todo code markers to GitHub issues"

[dependencies]
clap = { version = "4", features = ["derive"] }
glob = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[lib]
name = "jot"
path = "src/lib.rs"

[[bin]]
name = "0jot"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3"
